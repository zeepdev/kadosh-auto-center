<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo escuro/vermelho Kadosh -->
  <rect width="100" height="100" rx="20" fill="#0a0505" />
  
  <!-- Borda vermelha -->
  <rect x="5" y="5" width="90" height="90" rx="15" fill="none" stroke="#dc2743" stroke-width="6" />
  
  <!-- Letra K em vermelho e branco -->
  <text x="50" y="72" font-family="Arial, sans-serif" font-size="65" font-weight="bold" fill="#dc2743" text-anchor="middle">K</text>
</svg>